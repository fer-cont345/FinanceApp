<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Finanzas</title>
  <style>
    :root {
      --background: #0f1115;
      --surface: #191c23;
      --surface-light: #232733;
      --border: #2c313d;
      --text: #f2f3f5;
      --text-muted: #9aa1ad;
      --accent: #4fd1a5;
      --danger: #ff6b6b;
      --warning: #f5c451;
      --card-color: #7aa2ff;
      --envelope-color: #c792ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
      background: rgba(15, 17, 21, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .top-bar h1 { font-size: 24px; font-weight: 700; }

    .month-picker {
      background: var(--surface-light);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 15px;
      font-family: inherit;
    }

    main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .big-number { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }

    .stat-label { font-size: 12px; color: var(--text-muted); }
    .stat-value { font-size: 16px; font-weight: 600; margin-top: 2px; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .row:last-child { border-bottom: none; }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .row-amount { font-weight: 600; white-space: nowrap; text-align: right; }

    .tappable { cursor: pointer; }
    .tappable:active { opacity: 0.6; }

    .bar-track { height: 6px; background: var(--surface-light); border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; background: var(--accent); }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--surface-light);
      color: var(--text-muted);
      vertical-align: middle;
    }

    .badge.paid { background: rgba(79, 209, 165, 0.15); color: var(--accent); }
    .badge.pending { background: rgba(245, 196, 81, 0.15); color: var(--warning); }
    .badge.overdue { background: rgba(255, 107, 107, 0.15); color: var(--danger); }

    .check-button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--background);
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .check-button.checked { background: var(--accent); border-color: var(--accent); }

    .empty-state { text-align: center; color: var(--text-muted); padding: 24px 10px; font-size: 15px; }

    .warning-text { color: var(--danger); font-size: 14px; font-weight: 600; margin-top: 10px; }

    .day-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 14px 0 4px;
      display: flex;
      justify-content: space-between;
    }

    .week-navigator { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .week-label { text-align: center; font-weight: 600; }

    .icon-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--surface-light);
      color: var(--text);
      font-size: 20px;
      flex-shrink: 0;
    }

    .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }

    .filter-chip {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
    }

    .filter-chip.active { background: var(--accent); border-color: var(--accent); color: var(--background); }

    .check-button:disabled { opacity: 0.35; }

    .link-button {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
    }

    .add-button {
      position: fixed;
      right: 20px;
      bottom: calc(84px + env(safe-area-inset-bottom));
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: var(--background);
      font-size: 32px;
      font-weight: 400;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      z-index: 20;
    }

    .add-button.hidden { display: none; }

    .tab-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      background: rgba(25, 28, 35, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }

    .tab-button {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .tab-button .tab-icon { font-size: 20px; }
    .tab-button.active { color: var(--accent); }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: flex-end;
    }

    .sheet-overlay.hidden { display: none; }

    .sheet {
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    }

    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .sheet-header h2 { font-size: 20px; }

    .text-button { background: none; border: none; color: var(--accent); font-size: 16px; font-family: inherit; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .field.hidden, .checkbox-field.hidden { display: none; }

    .move-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .move-title { font-size: 18px; font-weight: 700; }
    .move-amount { font-size: 22px; font-weight: 700; color: var(--accent); white-space: nowrap; text-align: right; }
    .move-amount-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }

    .summary-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .summary-chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: var(--surface-light); color: var(--text-muted); }
    .summary-chip strong { color: var(--text); }

    .payment-block { margin-top: 14px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .payment-block-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-light); }
    .payment-block-title { font-size: 14px; font-weight: 700; }
    .payment-block-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .payment-block-amount { font-size: 15px; font-weight: 700; white-space: nowrap; }

    .breakdown-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .breakdown-table th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; padding: 8px 12px 6px; }
    .breakdown-table td { padding: 8px 12px; border-top: 1px solid var(--border); vertical-align: top; }
    .breakdown-table .number-cell { text-align: right; white-space: nowrap; }
    .breakdown-table th.number-cell { text-align: right; }
    .breakdown-concept { font-weight: 600; }
    .breakdown-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .type-tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; margin-right: 4px; vertical-align: 1px; }
    .type-tag.purchase { background: rgba(245, 196, 81, 0.15); color: var(--warning); }
    .type-tag.scheduled { background: rgba(122, 162, 255, 0.15); color: var(--card-color); }
    .type-tag.pending { background: rgba(255, 107, 107, 0.15); color: var(--danger); }

    .field input, .field select {
      width: 100%;
      background: var(--surface-light);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .checkbox-field { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 15px; }
    .checkbox-field input { width: 22px; height: 22px; accent-color: var(--accent); }

    .helper-text { font-size: 13px; color: var(--text-muted); margin: -6px 0 14px; }
    .hint-text { font-size: 14px; color: var(--accent); margin: -4px 0 14px; min-height: 1px; }

    .primary-button, .danger-button, .secondary-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      margin-top: 6px;
    }

    .primary-button { background: var(--accent); color: var(--background); }
    .danger-button { background: rgba(255, 107, 107, 0.12); color: var(--danger); }
    .secondary-button { background: var(--surface-light); color: var(--text); }
  </style>
</head>
<body>
  <header class="top-bar">
    <h1 id="screenTitle">Semana</h1>
    <input type="month" id="monthPicker" class="month-picker">
  </header>

  <main id="content"></main>

  <button id="addButton" class="add-button" aria-label="Agregar">+</button>

  <nav class="tab-bar">
    <button class="tab-button active" data-screen="week"><span class="tab-icon">📅</span>Semana</button>
    <button class="tab-button" data-screen="expenses"><span class="tab-icon">🧾</span>Gastos</button>
    <button class="tab-button" data-screen="cards"><span class="tab-icon">💳</span>Tarjetas</button>
    <button class="tab-button" data-screen="fixed"><span class="tab-icon">📌</span>Fijos</button>
    <button class="tab-button" data-screen="settings"><span class="tab-icon">⚙️</span>Ajustes</button>
  </nav>

  <div id="sheetOverlay" class="sheet-overlay hidden">
    <div class="sheet">
      <form id="sheetForm" autocomplete="off"></form>
    </div>
  </div>

  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <script>
    const storageKey = "financeLog.v2";

    const expenseCategories = [
      "Comida", "Súper", "Transporte", "Gasolina", "Hogar", "Servicios",
      "Salud", "Entretenimiento", "Ropa", "Arte", "Suscripciones", "Otros"
    ];

    const paymentMethodLabels = {
      cash: "Efectivo",
      debit: "Débito / transferencia",
      card: "Tarjeta de crédito",
      installments: "MSI"
    };

    const frequencyOptions = [
      { value: "w1", weeks: 1, months: 0, label: "Semanal" },
      { value: "w2", weeks: 2, months: 0, label: "Cada 2 semanas" },
      { value: "m1", weeks: 0, months: 1, label: "Mensual" },
      { value: "m2", weeks: 0, months: 2, label: "Bimestral" },
      { value: "m3", weeks: 0, months: 3, label: "Trimestral" },
      { value: "m6", weeks: 0, months: 6, label: "Semestral" },
      { value: "m12", weeks: 0, months: 12, label: "Anual" }
    ];

    const weekDayNames = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

    const screenTitles = {
      week: "Semana",
      expenses: "Gastos",
      cards: "Tarjetas",
      fixed: "Gastos fijos",
      settings: "Ajustes"
    };

    let appData = loadData();
    let currentScreen = "week";
    let selectedMonth = getMonthKey(new Date());
    let selectedWeekStart = getWeekStart(getTodayDateString());
    let sheetType = null;
    let sheetEditingId = null;
    let sheetCoverageTotal = 0;
    let selectedExpenseFilter = "all";

    // ---------- Storage ----------

    /** Returns a new empty data structure. */
    function createEmptyData() {
      return {
        settings: { weeklySalary: 0, paydayDayOfWeek: 4, trackingStartDate: getTodayDateString() },
        cards: [],
        expenses: [],
        fixedExpenses: [],
        envelopes: [],
        savingsCoverages: {}
      };
    }

    /** Reads the saved data from the phone, or returns empty data. */
    function loadData() {
      const emptyData = createEmptyData();
      try {
        const storedText = localStorage.getItem(storageKey);
        if (!storedText) {
          return emptyData;
        }
        return normalizeData(JSON.parse(storedText));
      } catch (error) {
        return emptyData;
      }
    }

    /** Makes sure every list and setting exists in loaded or imported data. */
    function normalizeData(rawData) {
      const emptyData = createEmptyData();
      const rawSettings = rawData.settings || {};
      return {
        settings: {
          weeklySalary: Number(rawSettings.weeklySalary) || 0,
          paydayDayOfWeek: rawSettings.paydayDayOfWeek == null ? emptyData.settings.paydayDayOfWeek : Number(rawSettings.paydayDayOfWeek),
          trackingStartDate: rawSettings.trackingStartDate || emptyData.settings.trackingStartDate
        },
        cards: Array.isArray(rawData.cards) ? rawData.cards : [],
        expenses: Array.isArray(rawData.expenses) ? rawData.expenses : [],
        fixedExpenses: Array.isArray(rawData.fixedExpenses) ? rawData.fixedExpenses : [],
        envelopes: Array.isArray(rawData.envelopes) ? rawData.envelopes : [],
        savingsCoverages: rawData.savingsCoverages && typeof rawData.savingsCoverages === "object" ? rawData.savingsCoverages : {}
      };
    }

    /** Saves all the data on the phone. */
    function saveData() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(appData));
      } catch (error) {
        alert("No se pudo guardar. Exporta un respaldo.");
      }
    }

    /** Creates a unique id for a new record. */
    function createId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    /** Finds a record by id inside a list. */
    function findRecord(records, recordId) {
      if (!recordId) {
        return null;
      }
      return records.find(function (record) {
        return record.id === recordId;
      }) || null;
    }

    /** Inserts a new record or replaces the existing one with the same id. */
    function upsertRecord(records, record) {
      const existingIndex = records.findIndex(function (item) {
        return item.id === record.id;
      });
      if (existingIndex === -1) {
        records.push(record);
      } else {
        records[existingIndex] = record;
      }
    }

    // ---------- Date helpers ----------

    /** Returns a month key like "2026-11" for a date. */
    function getMonthKey(date) {
      const month = String(date.getMonth() + 1).padStart(2, "0");
      return date.getFullYear() + "-" + month;
    }

    /** Converts a date into a "YYYY-MM-DD" string. */
    function toDateString(date) {
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return date.getFullYear() + "-" + month + "-" + day;
    }

    /** Returns today's date as "YYYY-MM-DD". */
    function getTodayDateString() {
      return toDateString(new Date());
    }

    /** Converts a "YYYY-MM-DD" string into a local Date. */
    function parseDateString(dateString) {
      const parts = dateString.split("-");
      return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    }

    /** Builds a date string for a year, month and day, moving the day back if the month is shorter. */
    function createClampedDateString(year, monthIndex, day) {
      const normalizedYear = year + Math.floor(monthIndex / 12);
      const normalizedMonth = ((monthIndex % 12) + 12) % 12;
      const lastDayOfMonth = new Date(normalizedYear, normalizedMonth + 1, 0).getDate();
      return toDateString(new Date(normalizedYear, normalizedMonth, Math.min(day, lastDayOfMonth)));
    }

    /** Adds months to a date string, keeping the day inside the target month. */
    function addMonthsToDateString(dateString, monthsToAdd) {
      const date = parseDateString(dateString);
      return createClampedDateString(date.getFullYear(), date.getMonth() + monthsToAdd, date.getDate());
    }

    /** Adds days to a date string. */
    function addDaysToDateString(dateString, daysToAdd) {
      const date = parseDateString(dateString);
      date.setDate(date.getDate() + daysToAdd);
      return toDateString(date);
    }

    /** Returns the number of days between two date strings. */
    function getDaysBetween(fromDateString, toDateStringValue) {
      const fromDate = parseDateString(fromDateString);
      const toDate = parseDateString(toDateStringValue);
      const fromUtc = Date.UTC(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
      const toUtc = Date.UTC(toDate.getFullYear(), toDate.getMonth(), toDate.getDate());
      return Math.round((toUtc - fromUtc) / 86400000);
    }

    /** Returns the payday that starts the week a date belongs to. */
    function getWeekStart(dateString) {
      const date = parseDateString(dateString);
      const daysSincePayday = (date.getDay() - appData.settings.paydayDayOfWeek + 7) % 7;
      return addDaysToDateString(dateString, -daysSincePayday);
    }

    // ---------- Format helpers ----------

    /** Formats a number as Mexican pesos. */
    function formatMoney(amount) {
      return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" }).format(amount || 0);
    }

    /** Formats a date string like "25 nov 2026". */
    function formatDate(dateString) {
      return parseDateString(dateString).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
    }

    /** Formats a date string like "25 nov". */
    function formatShortDate(dateString) {
      return parseDateString(dateString).toLocaleDateString("es-MX", { day: "numeric", month: "short" });
    }

    /** Formats a date string like "jue 12 nov". */
    function formatWeekDayDate(dateString) {
      return parseDateString(dateString).toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "short" });
    }

    /** Formats a month key as "noviembre 2026". */
    function formatMonth(monthKey) {
      return parseDateString(monthKey + "-01").toLocaleDateString("es-MX", { month: "long", year: "numeric" });
    }

    /** Escapes text so it can be safely inserted as HTML. */
    function escapeHtml(text) {
      return String(text == null ? "" : text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    /** Returns the frequency option value ("w1", "m2"...) of a fixed expense. */
    function getFrequencyValue(fixedExpense) {
      if (Number(fixedExpense.frequencyWeeks) > 0) {
        return "w" + Number(fixedExpense.frequencyWeeks);
      }
      return "m" + Number(fixedExpense.frequencyMonths);
    }

    /** Returns the readable frequency of a fixed expense. */
    function getFrequencyLabel(fixedExpense) {
      const frequencyValue = getFrequencyValue(fixedExpense);
      const option = frequencyOptions.find(function (item) {
        return item.value === frequencyValue;
      });
      return option ? option.label : frequencyValue;
    }

    /** Returns a readable payment method, including the card name when there is one. */
    function getPaymentMethodText(paymentMethod, cardId) {
      const label = paymentMethodLabels[paymentMethod] || paymentMethod;
      if (paymentMethod === "card" || paymentMethod === "installments") {
        const card = findRecord(appData.cards, cardId);
        return (paymentMethod === "installments" ? "MSI" : "Tarjeta") + " " + (card ? card.name : "(eliminada)");
      }
      return label;
    }

    // ---------- Credit card statements ----------
    // A statement is identified by its cutoff date ("YYYY-MM-DD").

    /** Returns the cutoff date of a card for a given month. */
    function getCutoffDate(card, year, monthIndex) {
      return createClampedDateString(year, monthIndex, Number(card.cutoffDay));
    }

    /** Returns the statement (cutoff date) where a purchase made on a date is billed. */
    function getStatementKeyForDate(card, dateString) {
      const date = parseDateString(dateString);
      const cutoffThisMonth = getCutoffDate(card, date.getFullYear(), date.getMonth());
      if (dateString <= cutoffThisMonth) {
        return cutoffThisMonth;
      }
      return getCutoffDate(card, date.getFullYear(), date.getMonth() + 1);
    }

    /** Moves a statement key forward or backward a number of months. */
    function shiftStatementKey(card, statementKey, monthsToShift) {
      const date = parseDateString(statementKey);
      return getCutoffDate(card, date.getFullYear(), date.getMonth() + monthsToShift);
    }

    /** Returns the payment due date of a statement. */
    function getStatementDueDate(card, statementKey) {
      const cutoffDate = parseDateString(statementKey);
      if (Number(card.paymentDay) > Number(card.cutoffDay)) {
        return createClampedDateString(cutoffDate.getFullYear(), cutoffDate.getMonth(), Number(card.paymentDay));
      }
      return createClampedDateString(cutoffDate.getFullYear(), cutoffDate.getMonth() + 1, Number(card.paymentDay));
    }

    /** Returns the statement whose payment is the next one to make. */
    function getNextPaymentStatementKey(card, todayDateString) {
      const openStatementKey = getStatementKeyForDate(card, todayDateString);
      const lastClosedStatementKey = shiftStatementKey(card, openStatementKey, -1);
      if (getStatementDueDate(card, lastClosedStatementKey) >= todayDateString) {
        return lastClosedStatementKey;
      }
      return openStatementKey;
    }

    /** Checks if a statement already passed its cutoff date, so its total can no longer change. */
    function isStatementClosed(statementKey) {
      return getTodayDateString() > statementKey;
    }

    /** Checks if a statement was due before the app was first used, so it is taken as already paid. */
    function isStatementPaidBeforeTracking(card, statementKey) {
      return getStatementDueDate(card, statementKey) < appData.settings.trackingStartDate;
    }

    /** Checks if a statement of a card is paid: marked by the user or due before the app was first used. */
    function isStatementPaid(card, statementKey) {
      if (isStatementPaidBeforeTracking(card, statementKey)) {
        return true;
      }
      return Array.isArray(card.paidStatementKeys) && card.paidStatementKeys.indexOf(statementKey) !== -1;
    }

    /** Returns each monthly payment of an MSI expense with its statement and due date. */
    function getInstallmentSchedule(expense) {
      const card = findRecord(appData.cards, expense.cardId);
      if (!card) {
        return [];
      }

      const schedule = [];
      const firstStatementKey = getStatementKeyForDate(card, expense.date);
      const monthlyAmount = Number(expense.amount) / Number(expense.months);
      let previousDueDate = expense.date;

      for (let index = 0; index < Number(expense.months); index++) {
        const statementKey = shiftStatementKey(card, firstStatementKey, index);
        const dueDate = getStatementDueDate(card, statementKey);
        schedule.push({
          number: index + 1,
          statementKey: statementKey,
          dueDate: dueDate,
          startDate: previousDueDate,
          amount: monthlyAmount,
          isPaid: isStatementPaid(card, statementKey)
        });
        previousDueDate = dueDate;
      }

      return schedule;
    }

    // ---------- Fixed expenses ----------

    /** Returns the date of a fixed expense charge number "index" counted from its next charge date. */
    function getFixedOccurrenceDate(fixedExpense, index) {
      const frequencyWeeks = Number(fixedExpense.frequencyWeeks) || 0;
      if (frequencyWeeks > 0) {
        return addDaysToDateString(fixedExpense.nextChargeDate, index * frequencyWeeks * 7);
      }
      return addMonthsToDateString(fixedExpense.nextChargeDate, index * Number(fixedExpense.frequencyMonths));
    }

    /** Returns the charge dates of a fixed expense from its next charge date up to two years ahead. */
    function getFixedOccurrences(fixedExpense) {
      const occurrences = [];
      const limitDate = addDaysToDateString(getTodayDateString(), 730);

      for (let index = 0; index < 400; index++) {
        const occurrenceDate = getFixedOccurrenceDate(fixedExpense, index);
        if (occurrenceDate > limitDate) {
          break;
        }
        occurrences.push({
          date: occurrenceDate,
          previousDate: getFixedOccurrenceDate(fixedExpense, index - 1)
        });
      }

      return occurrences;
    }

    /** Returns the expense created when a fixed expense charge was registered, or null. */
    function getRegisteredExpense(fixedExpenseId, occurrenceDate) {
      return appData.expenses.find(function (expense) {
        return expense.fixedExpenseId === fixedExpenseId && expense.occurrenceDate === occurrenceDate;
      }) || null;
    }

    // ---------- Payment items ----------
    // A payment item is something that must be paid on a due date.
    // kind "purchase": a normal card purchase, moved complete to the card's envelope in the week it is made.
    // kind "spread": fixed expenses, MSI payments and purchases marked to spread; saved little by little until the due date.
    // kind "initial": the balance a card had when the app started being used.

    /** Creates a payment item that belongs to a credit card statement. */
    function createCardItem(card, statementKey, label, amount, startDate, kind) {
      return {
        groupKey: "card-" + card.id + "-" + statementKey,
        cardId: card.id,
        statementKey: statementKey,
        label: label,
        amount: amount,
        startDate: startDate,
        dueDate: getStatementDueDate(card, statementKey),
        kind: kind,
        isPaid: isStatementPaid(card, statementKey)
      };
    }

    /** Returns the date of the charge before a given charge of a fixed expense. */
    function getPreviousChargeDate(fixedExpense, occurrenceDate) {
      const frequencyWeeks = Number(fixedExpense.frequencyWeeks) || 0;
      if (frequencyWeeks > 0) {
        return addDaysToDateString(occurrenceDate, -frequencyWeeks * 7);
      }
      return addMonthsToDateString(occurrenceDate, -Number(fixedExpense.frequencyMonths));
    }

    /** Returns the date from which a fixed expense charge starts being saved: a weekly charge in its own week, longer ones since the previous charge. */
    function getFixedSavingStartDate(fixedExpense, occurrenceDate) {
      if (Number(fixedExpense.frequencyWeeks) === 1) {
        return occurrenceDate;
      }
      return getPreviousChargeDate(fixedExpense, occurrenceDate);
    }

    /** Builds every payment item from cards, the expense log and fixed expenses. */
    function buildPaymentItems() {
      const items = [];

      appData.cards.forEach(function (card) {
        if (Number(card.initialBalance) > 0 && card.initialBalanceStatementKey) {
          items.push(createCardItem(card, card.initialBalanceStatementKey, "Saldo inicial", Number(card.initialBalance), card.createdDate, "initial"));
        }
      });

      appData.expenses.forEach(function (expense) {
        const card = findRecord(appData.cards, expense.cardId);
        if (!card) {
          return;
        }

        if (expense.paymentMethod === "card") {
          const statementKey = getStatementKeyForDate(card, expense.date);
          const fixedExpense = findRecord(appData.fixedExpenses, expense.fixedExpenseId);
          if (fixedExpense) {
            const startDate = getFixedSavingStartDate(fixedExpense, expense.occurrenceDate || expense.date);
            items.push(createCardItem(card, statementKey, expense.description, Number(expense.amount), startDate, "spread"));
          } else if (expense.spreadUntilDue) {
            items.push(createCardItem(card, statementKey, expense.description + " (repartido)", Number(expense.amount), expense.date, "spread"));
          } else {
            items.push(createCardItem(card, statementKey, expense.description, Number(expense.amount), expense.date, "purchase"));
          }
        } else if (expense.paymentMethod === "installments") {
          getInstallmentSchedule(expense).forEach(function (installment) {
            const label = expense.description + " (" + installment.number + "/" + expense.months + ")";
            items.push(createCardItem(card, installment.statementKey, label, installment.amount, installment.startDate, "spread"));
          });
        }
      });

      appData.fixedExpenses.forEach(function (fixedExpense) {
        if (!fixedExpense.isActive) {
          return;
        }

        getFixedOccurrences(fixedExpense).forEach(function (occurrence) {
          if (getRegisteredExpense(fixedExpense.id, occurrence.date)) {
            return;
          }

          const startDate = getFixedSavingStartDate(fixedExpense, occurrence.date);

          if (fixedExpense.paymentMethod === "card") {
            const card = findRecord(appData.cards, fixedExpense.cardId);
            if (card) {
              const statementKey = getStatementKeyForDate(card, occurrence.date);
              items.push(createCardItem(card, statementKey, fixedExpense.name, Number(fixedExpense.amount), startDate, "spread"));
            }
          } else {
            items.push({
              groupKey: "fixed-" + fixedExpense.id + "-" + occurrence.date,
              cardId: null,
              statementKey: null,
              label: fixedExpense.name,
              amount: Number(fixedExpense.amount),
              startDate: startDate,
              dueDate: occurrence.date,
              kind: "spread",
              isPaid: false
            });
          }
        });
      });

      return items;
    }

    // ---------- Spreading amounts across weeks ----------

    /** Returns the payday week when the app started being used. */
    function getTrackingStartWeek() {
      return getWeekStart(appData.settings.trackingStartDate);
    }

    /** Returns the first and last week an item is saved for, and how many weeks that is. */
    function getItemWindow(item) {
      const firstWeek = getWeekStart(item.startDate);
      let lastWeek = getWeekStart(addDaysToDateString(item.dueDate, -1));
      if (lastWeek < firstWeek) {
        lastWeek = firstWeek;
      }
      return {
        firstWeek: firstWeek,
        lastWeek: lastWeek,
        numberOfWeeks: getDaysBetween(firstWeek, lastWeek) / 7 + 1
      };
    }

    /** Returns the part of a spread item that belongs to a week. */
    function getSpreadShare(item, weekStart) {
      const itemWindow = getItemWindow(item);
      if (weekStart < itemWindow.firstWeek || weekStart > itemWindow.lastWeek) {
        return 0;
      }
      return item.amount / itemWindow.numberOfWeeks;
    }

    /** Returns the part of a cash or debit fixed expense for a week; weeks before the app was used are skipped so the full amount is still asked. */
    function getCashFixedShare(item, weekStart) {
      const itemWindow = getItemWindow(item);
      const trackingStartWeek = getTrackingStartWeek();
      let firstWeek = itemWindow.firstWeek;
      if (firstWeek < trackingStartWeek) {
        firstWeek = trackingStartWeek;
      }
      let lastWeek = itemWindow.lastWeek;
      if (lastWeek < firstWeek) {
        lastWeek = firstWeek;
      }
      if (weekStart < firstWeek || weekStart > lastWeek) {
        return 0;
      }
      return item.amount / (getDaysBetween(firstWeek, lastWeek) / 7 + 1);
    }

    /** Returns the part of a card item that should already have been set aside before the app was used. */
    function getPartBeforeTracking(item) {
      if (item.kind === "initial") {
        return item.amount;
      }
      if (item.kind === "purchase") {
        return item.startDate < appData.settings.trackingStartDate ? item.amount : 0;
      }

      const itemWindow = getItemWindow(item);
      const trackingStartWeek = getTrackingStartWeek();
      if (itemWindow.firstWeek >= trackingStartWeek) {
        return 0;
      }
      let weeksBefore = getDaysBetween(itemWindow.firstWeek, trackingStartWeek) / 7;
      if (weeksBefore > itemWindow.numberOfWeeks) {
        weeksBefore = itemWindow.numberOfWeeks;
      }
      return (item.amount / itemWindow.numberOfWeeks) * weeksBefore;
    }

    // ---------- Card statements summary ----------

    /** Groups the card items by statement and calculates the amount pending from before the app was used. */
    function buildStatementSummaries(paymentItems) {
      const summaries = {};

      paymentItems.forEach(function (item) {
        if (!item.cardId) {
          return;
        }
        if (!summaries[item.groupKey]) {
          const card = findRecord(appData.cards, item.cardId);
          summaries[item.groupKey] = {
            key: item.groupKey,
            card: card,
            statementKey: item.statementKey,
            dueDate: item.dueDate,
            isPaid: item.isPaid,
            totalAmount: 0,
            pendingBeforeAmount: 0,
            items: []
          };
        }
        const summary = summaries[item.groupKey];
        summary.totalAmount += item.amount;
        summary.pendingBeforeAmount += getPartBeforeTracking(item);
        summary.items.push(item);
      });

      Object.keys(summaries).forEach(function (key) {
        const summary = summaries[key];
        if (summary.pendingBeforeAmount < 0.005) {
          summary.pendingBeforeAmount = 0;
        }
        const coveredAmount = Number(appData.savingsCoverages["pending-" + key]) || 0;
        summary.pendingCoveredAmount = Math.min(coveredAmount, summary.pendingBeforeAmount);
        summary.pendingRemainingAmount = summary.pendingBeforeAmount - summary.pendingCoveredAmount;
      });

      return summaries;
    }

    /** Returns the weekly part of the pending amount that is not covered, spread from the first week of use until the due date. */
    function getPendingShare(summary, weekStart) {
      if (summary.pendingRemainingAmount <= 0.005) {
        return 0;
      }
      const firstWeek = getTrackingStartWeek();
      let lastWeek = getWeekStart(addDaysToDateString(summary.dueDate, -1));
      if (lastWeek < firstWeek) {
        lastWeek = firstWeek;
      }
      if (weekStart < firstWeek || weekStart > lastWeek) {
        return 0;
      }
      return summary.pendingRemainingAmount / (getDaysBetween(firstWeek, lastWeek) / 7 + 1);
    }

    /** Returns which week of its saving period a week is, like "2 de 8". */
    function getWeekProgressText(firstWeek, lastWeek, weekStart) {
      const weekNumber = getDaysBetween(firstWeek, weekStart) / 7 + 1;
      const numberOfWeeks = getDaysBetween(firstWeek, lastWeek) / 7 + 1;
      return "Semana " + weekNumber + " de " + numberOfWeeks;
    }

    /** Returns what must be moved to a card's envelope in a week for one statement, item by item. */
    function getStatementWeekDetails(summary, weekStart) {
      const details = [];
      if (summary.isPaid || weekStart < getTrackingStartWeek()) {
        return details;
      }

      const weekEnd = addDaysToDateString(weekStart, 6);

      summary.items.forEach(function (item) {
        if (item.kind === "purchase") {
          const isThisWeek = item.startDate >= weekStart && item.startDate <= weekEnd;
          if (isThisWeek && item.startDate >= appData.settings.trackingStartDate) {
            details.push({
              label: item.label,
              type: "purchase",
              totalAmount: item.amount,
              amount: item.amount,
              note: "Compra del " + formatShortDate(item.startDate)
            });
          }
        } else if (item.kind === "spread") {
          const share = getSpreadShare(item, weekStart);
          if (share > 0.005) {
            const itemWindow = getItemWindow(item);
            details.push({
              label: item.label,
              type: "scheduled",
              totalAmount: item.amount,
              amount: share,
              note: getWeekProgressText(itemWindow.firstWeek, itemWindow.lastWeek, weekStart)
            });
          }
        }
      });

      const pendingShare = getPendingShare(summary, weekStart);
      if (pendingShare > 0.005) {
        let lastWeek = getWeekStart(addDaysToDateString(summary.dueDate, -1));
        if (lastWeek < getTrackingStartWeek()) {
          lastWeek = getTrackingStartWeek();
        }
        details.push({
          label: "Pendiente de antes sin cubrir",
          type: "pending",
          totalAmount: summary.pendingRemainingAmount,
          amount: pendingShare,
          note: getWeekProgressText(getTrackingStartWeek(), lastWeek, weekStart)
        });
      }

      return details;
    }

    /** Returns how much a card's envelope should have today for its unpaid statements. */
    function getExpectedEnvelopeBalance(card, summaries) {
      const currentWeek = getWeekStart(getTodayDateString());
      const trackingStartWeek = getTrackingStartWeek();
      let total = 0;

      Object.keys(summaries).forEach(function (key) {
        const summary = summaries[key];
        if (summary.card.id !== card.id || summary.isPaid) {
          return;
        }
        total += summary.pendingCoveredAmount;
        for (let weekStart = trackingStartWeek; weekStart <= currentWeek; weekStart = addDaysToDateString(weekStart, 7)) {
          getStatementWeekDetails(summary, weekStart).forEach(function (detail) {
            total += detail.amount;
          });
        }
      });

      return total;
    }

    // ---------- Weekly plan ----------

    /** Returns the sum of the weekly amounts of all envelopes. */
    function getEnvelopeTotal() {
      let total = 0;
      appData.envelopes.forEach(function (envelope) {
        total += Number(envelope.weeklyAmount) || 0;
      });
      return total;
    }

    /** Calculates what to move to each card envelope, what to set aside for cash fixed expenses and what is free in a week. */
    function getWeekPlan(weekStart) {
      const paymentItems = buildPaymentItems();
      const summaries = buildStatementSummaries(paymentItems);
      const weekEnd = addDaysToDateString(weekStart, 6);
      const cardGroups = [];

      appData.cards.forEach(function (card) {
        const group = { cardId: card.id, name: card.name, purchaseAmount: 0, scheduledAmount: 0, pendingAmount: 0, totalAmount: 0, paymentBlocks: [] };

        const cardSummaries = Object.keys(summaries).map(function (key) {
          return summaries[key];
        }).filter(function (summary) {
          return summary.card.id === card.id;
        });
        cardSummaries.sort(function (first, second) {
          return first.dueDate.localeCompare(second.dueDate);
        });

        cardSummaries.forEach(function (summary) {
          const details = getStatementWeekDetails(summary, weekStart);
          if (details.length === 0) {
            return;
          }
          const paymentBlock = { dueDate: summary.dueDate, statementKey: summary.statementKey, statementTotal: summary.totalAmount, weekAmount: 0, rows: details };
          details.forEach(function (detail) {
            paymentBlock.weekAmount += detail.amount;
            if (detail.type === "purchase") {
              group.purchaseAmount += detail.amount;
            } else if (detail.type === "pending") {
              group.pendingAmount += detail.amount;
            } else {
              group.scheduledAmount += detail.amount;
            }
          });
          group.paymentBlocks.push(paymentBlock);
        });

        group.totalAmount = group.purchaseAmount + group.scheduledAmount + group.pendingAmount;
        if (group.totalAmount > 0.005) {
          cardGroups.push(group);
        }
      });

      const cashGroup = { totalAmount: 0, rows: [] };
      if (weekStart >= getTrackingStartWeek()) {
        paymentItems.forEach(function (item) {
          if (item.cardId) {
            return;
          }
          const share = getCashFixedShare(item, weekStart);
          if (share > 0.005) {
            const itemWindow = getItemWindow(item);
            let firstWeek = itemWindow.firstWeek;
            if (firstWeek < getTrackingStartWeek()) {
              firstWeek = getTrackingStartWeek();
            }
            cashGroup.totalAmount += share;
            cashGroup.rows.push({
              label: item.label,
              type: "scheduled",
              totalAmount: item.amount,
              amount: share,
              note: "Vence " + formatShortDate(item.dueDate) + " · " + getWeekProgressText(firstWeek, itemWindow.lastWeek < firstWeek ? firstWeek : itemWindow.lastWeek, weekStart)
            });
          }
        });
      }

      let cashSpent = 0;
      const spendingByCategory = {};
      appData.expenses.forEach(function (expense) {
        if (expense.date < weekStart || expense.date > weekEnd || expense.fixedExpenseId) {
          return;
        }
        const isCash = expense.paymentMethod === "cash" || expense.paymentMethod === "debit";
        const isCardPurchase = expense.paymentMethod === "card" && !expense.spreadUntilDue && expense.date >= appData.settings.trackingStartDate;
        if (isCash) {
          cashSpent += Number(expense.amount);
        }
        if (isCash || isCardPurchase) {
          if (!spendingByCategory[expense.category]) {
            spendingByCategory[expense.category] = 0;
          }
          spendingByCategory[expense.category] += Number(expense.amount);
        }
      });

      let purchaseTotal = 0;
      let scheduledTotal = cashGroup.totalAmount;
      cardGroups.forEach(function (group) {
        purchaseTotal += group.purchaseAmount;
        scheduledTotal += group.scheduledAmount + group.pendingAmount;
      });

      const envelopeUsage = {};
      let coveredByEnvelopes = 0;
      appData.envelopes.forEach(function (envelope) {
        let usedAmount = 0;
        if (envelope.category && spendingByCategory[envelope.category]) {
          usedAmount = Math.min(Number(envelope.weeklyAmount), spendingByCategory[envelope.category]);
          spendingByCategory[envelope.category] -= usedAmount;
        }
        envelopeUsage[envelope.id] = usedAmount;
        coveredByEnvelopes += usedAmount;
      });

      const salary = Number(appData.settings.weeklySalary) || 0;
      const envelopeTotal = getEnvelopeTotal();
      const savingsUsed = Number(appData.savingsCoverages["week-" + weekStart]) || 0;
      const spendingOutsideEnvelopes = cashSpent + purchaseTotal - coveredByEnvelopes;

      return {
        cardGroups: cardGroups,
        cashGroup: cashGroup,
        scheduledTotal: scheduledTotal,
        purchaseTotal: purchaseTotal,
        cashSpent: cashSpent,
        envelopeTotal: envelopeTotal,
        envelopeUsage: envelopeUsage,
        savingsUsed: savingsUsed,
        salary: salary,
        freeAmount: salary - scheduledTotal - envelopeTotal - spendingOutsideEnvelopes + savingsUsed
      };
    }

    // ---------- Monthly spending ----------

    /** Returns the month total and totals by category for the expenses that match a filter; MSI purchases count only the payments due that month. */
    function getMonthSpending(monthKey, filterValue) {
      const totalsByCategory = {};
      let total = 0;

      /** Adds an amount to the month total and to its category. */
      function addAmount(category, amount) {
        total += amount;
        if (!totalsByCategory[category]) {
          totalsByCategory[category] = 0;
        }
        totalsByCategory[category] += amount;
      }

      appData.expenses.forEach(function (expense) {
        if (!matchesExpenseFilter(expense, filterValue)) {
          return;
        }
        if (expense.paymentMethod === "installments") {
          getInstallmentSchedule(expense).forEach(function (installment) {
            if (installment.dueDate.slice(0, 7) === monthKey) {
              addAmount(expense.category, installment.amount);
            }
          });
        } else if (expense.date.slice(0, 7) === monthKey) {
          addAmount(expense.category, Number(expense.amount));
        }
      });

      return { total: total, totalsByCategory: totalsByCategory };
    }

    // ---------- Rendering ----------

    /** Draws the current screen. */
    function render() {
      document.getElementById("screenTitle").textContent = screenTitles[currentScreen];

      const showMonthPicker = currentScreen === "expenses" || currentScreen === "fixed";
      document.getElementById("monthPicker").style.visibility = showMonthPicker ? "visible" : "hidden";
      document.getElementById("addButton").classList.toggle("hidden", currentScreen === "settings");

      document.querySelectorAll(".tab-button").forEach(function (button) {
        button.classList.toggle("active", button.dataset.screen === currentScreen);
      });

      const content = document.getElementById("content");
      if (currentScreen === "week") {
        content.innerHTML = renderWeek();
      } else if (currentScreen === "expenses") {
        content.innerHTML = renderExpenses();
      } else if (currentScreen === "cards") {
        content.innerHTML = renderCards();
      } else if (currentScreen === "fixed") {
        content.innerHTML = renderFixedExpenses();
      } else {
        content.innerHTML = renderSettings();
      }
    }

    /** Builds the weekly screen: what to move to each envelope, what is free and what was spent. */
    function renderWeek() {
      const weekEnd = addDaysToDateString(selectedWeekStart, 6);
      const currentWeekStart = getWeekStart(getTodayDateString());
      const plan = getWeekPlan(selectedWeekStart);

      let html = '<div class="card week-navigator">' +
        '<button class="icon-button" data-action="previous-week">‹</button>' +
        '<div class="week-label">' + escapeHtml(formatWeekDayDate(selectedWeekStart)) + ' – ' + escapeHtml(formatWeekDayDate(weekEnd)) +
          (selectedWeekStart === currentWeekStart ? '<div class="row-subtitle">Esta semana</div>' : '<div><button class="link-button" data-action="current-week">Ir a esta semana</button></div>') +
        '</div>' +
        '<button class="icon-button" data-action="next-week">›</button>' +
      '</div>';

      if (plan.salary <= 0) {
        html += '<div class="card"><div class="empty-state">Configura tu sueldo semanal para calcular lo que te queda libre.<br><br>' +
          '<button class="primary-button" data-action="edit-settings">Configurar sueldo</button></div></div>';
      }

      if (selectedWeekStart < getTrackingStartWeek()) {
        html += '<div class="card"><div class="empty-state">Esta semana es de antes de que empezaras a usar la app.</div></div>';
      }

      html += '<div class="card">' +
        '<div class="card-title">Libre esta semana</div>' +
        '<div class="big-number" style="color:' + (plan.freeAmount < 0 ? 'var(--danger)' : 'var(--text)') + '">' + formatMoney(plan.freeAmount) + '</div>' +
        '<div class="stat-grid">' +
          '<div><div class="stat-label">Sueldo</div><div class="stat-value">' + formatMoney(plan.salary) + '</div></div>' +
          '<div><div class="stat-label">Por apartar</div><div class="stat-value" style="color:var(--card-color)">' + formatMoney(plan.scheduledTotal) + '</div></div>' +
          '<div><div class="stat-label">Gastado</div><div class="stat-value" style="color:var(--warning)">' + formatMoney(plan.purchaseTotal + plan.cashSpent) + '</div></div>' +
        '</div>' +
        '<div class="row" style="padding-bottom:0;margin-top:8px"><div class="row-main row-subtitle">Apartados personales</div><div class="row-amount" style="color:var(--envelope-color)">' + formatMoney(plan.envelopeTotal) + '</div></div>' +
        '<div class="row tappable" data-action="edit-week-savings" style="padding-bottom:0"><div class="row-main row-subtitle">Ahorro usado esta semana (tocar)</div><div class="row-amount" style="color:var(--accent)">' + formatMoney(plan.savingsUsed) + '</div></div>' +
        (plan.freeAmount < 0 && plan.salary > 0 ? '<div class="warning-text">Te faltan ' + formatMoney(-plan.freeAmount) + '. Cúbrelo con tu ahorro tocando "Ahorro usado".</div>' : '') +
      '</div>';

      if (plan.cardGroups.length === 0 && plan.cashGroup.totalAmount <= 0.005) {
        html += '<div class="card"><div class="card-title">Mover a tus apartados</div><div class="empty-state">Nada que mover esta semana.</div></div>';
      }

      plan.cardGroups.forEach(function (group) {
        html += renderCardMoveCard(group);
      });

      if (plan.cashGroup.totalAmount > 0.005) {
        html += renderCashMoveCard(plan.cashGroup);
      }

      html += '<div class="card"><div class="card-title">Apartados personales<button class="link-button" data-action="add-envelope">+ Agregar</button></div>';
      if (appData.envelopes.length === 0) {
        html += '<div class="empty-state">Agrega apartados como comida, ahorro o salidas.</div>';
      } else {
        appData.envelopes.forEach(function (envelope) {
          const usedAmount = plan.envelopeUsage[envelope.id] || 0;
          const subtitle = envelope.category
            ? 'Para ' + escapeHtml(envelope.category) + ' · usado ' + formatMoney(usedAmount)
            : 'Sin categoría (ahorro o meta)';
          html += '<div class="row tappable" data-action="edit-envelope" data-id="' + envelope.id + '">' +
            '<div class="row-main"><div class="row-title">' + escapeHtml(envelope.name) + '</div><div class="row-subtitle">' + subtitle + '</div></div>' +
            '<div class="row-amount">' + formatMoney(envelope.weeklyAmount) + '</div>' +
          '</div>';
        });
      }
      html += '</div>';

      html += '<div class="card"><div class="card-title">Gastado esta semana</div>' +
        '<div class="row"><div class="row-main">Efectivo / débito</div><div class="row-amount">' + formatMoney(plan.cashSpent) + '</div></div>' +
        '<div class="row"><div class="row-main">Tarjeta (compras normales)</div><div class="row-amount">' + formatMoney(plan.purchaseTotal) + '</div></div>' +
      '</div>';

      return html;
    }

    /** Builds the table rows of a breakdown: concept with its type and note, total and amount for this week. */
    function renderBreakdownTable(rows) {
      const typeLabels = { purchase: "Compra", scheduled: "Fijo/MSI", pending: "Pendiente" };
      let html = '<table class="breakdown-table"><thead><tr><th>Concepto</th><th class="number-cell">Total</th><th class="number-cell">Semana</th></tr></thead><tbody>';
      rows.forEach(function (row) {
        html += '<tr>' +
          '<td><div class="breakdown-concept"><span class="type-tag ' + row.type + '">' + typeLabels[row.type] + '</span>' + escapeHtml(row.label) + '</div>' +
            '<div class="breakdown-note">' + escapeHtml(row.note) + '</div></td>' +
          '<td class="number-cell">' + formatMoney(row.totalAmount) + '</td>' +
          '<td class="number-cell"><strong>' + formatMoney(row.amount) + '</strong></td>' +
        '</tr>';
      });
      return html + '</tbody></table>';
    }

    /** Builds the summary chips of a card: purchases, fixed and MSI, and pending. */
    function renderSummaryChips(group) {
      let html = '<div class="summary-chips">';
      if (group.purchaseAmount > 0.005) {
        html += '<span class="summary-chip">Compras <strong>' + formatMoney(group.purchaseAmount) + '</strong></span>';
      }
      if (group.scheduledAmount > 0.005) {
        html += '<span class="summary-chip">Fijos y MSI <strong>' + formatMoney(group.scheduledAmount) + '</strong></span>';
      }
      if (group.pendingAmount > 0.005) {
        html += '<span class="summary-chip">Pendiente <strong>' + formatMoney(group.pendingAmount) + '</strong></span>';
      }
      return html + '</div>';
    }

    /** Builds the card of the week for one credit card: amount to move and a table per payment date. */
    function renderCardMoveCard(group) {
      let html = '<div class="card">' +
        '<div class="move-header">' +
          '<div><div class="move-title">💳 ' + escapeHtml(group.name) + '</div><div class="row-subtitle">Mover a su apartado esta semana</div></div>' +
          '<div><div class="move-amount-label">Mover</div><div class="move-amount">' + formatMoney(group.totalAmount) + '</div></div>' +
        '</div>' +
        renderSummaryChips(group);

      group.paymentBlocks.forEach(function (paymentBlock) {
        html += '<div class="payment-block">' +
          '<div class="payment-block-header">' +
            '<div><div class="payment-block-title">Pago del ' + escapeHtml(formatShortDate(paymentBlock.dueDate)) + '</div>' +
            '<div class="payment-block-subtitle">Corte ' + escapeHtml(formatShortDate(paymentBlock.statementKey)) + ' · sin intereses ' + formatMoney(paymentBlock.statementTotal) + '</div></div>' +
            '<div class="payment-block-amount">' + formatMoney(paymentBlock.weekAmount) + '</div>' +
          '</div>' +
          renderBreakdownTable(paymentBlock.rows) +
        '</div>';
      });

      return html + '</div>';
    }

    /** Builds the card of the week for the fixed expenses paid with cash or debit. */
    function renderCashMoveCard(cashGroup) {
      return '<div class="card">' +
        '<div class="move-header">' +
          '<div><div class="move-title">🏦 Débito / efectivo</div><div class="row-subtitle">Fijos que no van a tarjeta</div></div>' +
          '<div><div class="move-amount-label">Apartar</div><div class="move-amount">' + formatMoney(cashGroup.totalAmount) + '</div></div>' +
        '</div>' +
        '<div class="payment-block">' + renderBreakdownTable(cashGroup.rows) + '</div>' +
      '</div>';
    }

    /** Checks if an expense matches the selected filter of the expense log. */
    function matchesExpenseFilter(expense, filterValue) {
      if (filterValue === "all") {
        return true;
      }
      if (filterValue === "cash" || filterValue === "debit") {
        return expense.paymentMethod === filterValue;
      }
      const cardId = filterValue.replace("card:", "");
      return (expense.paymentMethod === "card" || expense.paymentMethod === "installments") && expense.cardId === cardId;
    }

    /** Builds the filter buttons of the expense log: all, cash, debit and one per card. */
    function renderExpenseFilters() {
      const filters = [
        { value: "all", label: "Todos" },
        { value: "cash", label: "Efectivo" },
        { value: "debit", label: "Débito" }
      ];
      appData.cards.forEach(function (card) {
        filters.push({ value: "card:" + card.id, label: "💳 " + card.name });
      });

      let html = '<div class="filter-row">';
      filters.forEach(function (filter) {
        html += '<button class="filter-chip' + (filter.value === selectedExpenseFilter ? ' active' : '') + '" data-action="filter-expenses" data-id="' + escapeHtml(filter.value) + '">' + escapeHtml(filter.label) + '</button>';
      });
      return html + '</div>';
    }

    /** Builds the expense log for the selected month, grouped by day. */
    function renderExpenses() {
      if (selectedExpenseFilter !== "all" && selectedExpenseFilter.indexOf("card:") === 0 && !findRecord(appData.cards, selectedExpenseFilter.replace("card:", ""))) {
        selectedExpenseFilter = "all";
      }

      const monthSpending = getMonthSpending(selectedMonth, selectedExpenseFilter);

      const monthExpenses = appData.expenses.filter(function (expense) {
        return expense.date.slice(0, 7) === selectedMonth && matchesExpenseFilter(expense, selectedExpenseFilter);
      });
      monthExpenses.sort(function (first, second) {
        return second.date.localeCompare(first.date);
      });

      let html = renderExpenseFilters() + '<div class="card">' +
        '<div class="card-title">Total de ' + escapeHtml(formatMonth(selectedMonth)) + '</div>' +
        '<div class="big-number">' + formatMoney(monthSpending.total) + '</div>' +
        '<div class="row-subtitle">Las compras MSI cuentan solo con la mensualidad que vence este mes.</div>' +
      '</div>';

      const categoryNames = Object.keys(monthSpending.totalsByCategory);
      if (categoryNames.length > 0) {
        categoryNames.sort(function (first, second) {
          return monthSpending.totalsByCategory[second] - monthSpending.totalsByCategory[first];
        });

        html += '<div class="card"><div class="card-title">Por categoría</div>';
        categoryNames.forEach(function (categoryName) {
          const categoryTotal = monthSpending.totalsByCategory[categoryName];
          const percentage = monthSpending.total > 0 ? (categoryTotal / monthSpending.total) * 100 : 0;
          html += '<div class="row" style="display:block">' +
            '<div style="display:flex;justify-content:space-between"><span>' + escapeHtml(categoryName) + '</span>' +
            '<span class="row-amount">' + formatMoney(categoryTotal) + '</span></div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + percentage.toFixed(1) + '%"></div></div>' +
          '</div>';
        });
        html += '</div>';
      }

      if (monthExpenses.length === 0) {
        const emptyText = selectedExpenseFilter === "all" ? "Toca + para registrar un gasto." : "Sin gastos con este filtro este mes.";
        return html + '<div class="card"><div class="empty-state">' + emptyText + '</div></div>';
      }

      html += '<div class="card" style="padding-top:4px">';
      let currentDate = null;

      monthExpenses.forEach(function (expense) {
        if (expense.date !== currentDate) {
          currentDate = expense.date;
          html += '<div class="day-header"><span>' + escapeHtml(formatDate(currentDate)) + '</span></div>';
        }

        let subtitle = escapeHtml(expense.category) + ' · ' + escapeHtml(getPaymentMethodText(expense.paymentMethod, expense.cardId));
        if (expense.paymentMethod === "installments") {
          subtitle += ' · ' + expense.months + ' de ' + formatMoney(Number(expense.amount) / Number(expense.months));
        }
        if (expense.spreadUntilDue) {
          subtitle += ' · repartido';
        }
        if (expense.fixedExpenseId) {
          subtitle = '📌 ' + subtitle;
        }

        html += '<div class="row tappable" data-action="edit-expense" data-id="' + expense.id + '">' +
          '<div class="row-main"><div class="row-title">' + escapeHtml(expense.description) + '</div>' +
          '<div class="row-subtitle">' + subtitle + '</div></div>' +
          '<div class="row-amount">' + formatMoney(expense.amount) + '</div>' +
        '</div>';
      });

      return html + '</div>';
    }

    /** Builds one statement row: total to pay, paid check and the amount pending from before the app was used. */
    function renderStatementRow(card, statementKey, title, summary) {
      const today = getTodayDateString();
      const dueDate = getStatementDueDate(card, statementKey);
      const isPaid = isStatementPaid(card, statementKey);
      const total = summary ? summary.totalAmount : 0;

      let badge = '<span class="badge pending">Pendiente</span>';
      if (isPaid) {
        badge = '<span class="badge paid">Pagado</span>';
      } else if (!isStatementClosed(statementKey)) {
        badge = '<span class="badge">Aún no corta</span>';
      } else if (dueDate < today) {
        badge = '<span class="badge overdue">Vencido</span>';
      }

      const paidBeforeTracking = isStatementPaidBeforeTracking(card, statementKey);
      const canToggle = !paidBeforeTracking && (isPaid || isStatementClosed(statementKey));

      let pendingHtml = "";
      if (summary && summary.pendingBeforeAmount > 0.005 && !isPaid) {
        pendingHtml = '<div class="row-subtitle tappable" data-action="edit-pending" data-id="' + escapeHtml(summary.key) + '" style="color:var(--warning)">' +
          'Pendiente de antes: ' + formatMoney(summary.pendingBeforeAmount) + ' · cubierto ' + formatMoney(summary.pendingCoveredAmount) + ' (tocar)</div>';
      }

      return '<div class="row">' +
        '<button class="check-button' + (isPaid ? ' checked' : '') + '" data-action="toggle-statement" data-id="' + card.id + '" data-statement="' + statementKey + '"' + (canToggle ? '' : ' disabled') + '>' + (isPaid ? '✓' : '') + '</button>' +
        '<div class="row-main">' +
          '<div class="row-title">' + title + '</div>' +
          '<div class="row-subtitle">Corte ' + escapeHtml(formatShortDate(statementKey)) + ' · pago ' + escapeHtml(formatShortDate(dueDate)) + ' ' + badge + '</div>' +
          pendingHtml +
        '</div>' +
        '<div class="row-amount">' + formatMoney(total) + '<div class="row-subtitle">sin intereses</div></div>' +
      '</div>';
    }

    /** Builds the credit cards screen with statements, envelope balance and active MSI purchases. */
    function renderCards() {
      if (appData.cards.length === 0) {
        return '<div class="card"><div class="empty-state">Toca + para agregar tu primera tarjeta con su fecha de corte y de pago.</div></div>';
      }

      const today = getTodayDateString();
      const summaries = buildStatementSummaries(buildPaymentItems());
      let html = "";

      appData.cards.forEach(function (card) {
        const openStatementKey = getStatementKeyForDate(card, today);
        const lastClosedStatementKey = shiftStatementKey(card, openStatementKey, -1);
        const expectedBalance = getExpectedEnvelopeBalance(card, summaries);

        html += '<div class="card">' +
          '<div class="row tappable" data-action="edit-card" data-id="' + card.id + '" style="padding-top:0">' +
            '<div class="row-main"><div class="row-title" style="font-size:18px">💳 ' + escapeHtml(card.name) + '</div>' +
            '<div class="row-subtitle">Corte día ' + card.cutoffDay + ' · pago día ' + card.paymentDay + '</div></div>' +
            '<div class="row-subtitle">Editar ›</div>' +
          '</div>' +
          '<div class="row"><div class="row-main row-subtitle">Tu apartado debería tener hoy</div><div class="row-amount" style="color:var(--accent)">' + formatMoney(expectedBalance) + '</div></div>';

        for (let monthsBack = 6; monthsBack >= 2; monthsBack--) {
          const olderStatementKey = shiftStatementKey(card, openStatementKey, -monthsBack);
          const olderSummary = summaries["card-" + card.id + "-" + olderStatementKey];
          if (olderSummary && olderSummary.totalAmount > 0 && !isStatementPaid(card, olderStatementKey)) {
            html += renderStatementRow(card, olderStatementKey, "Pago anterior", olderSummary);
          }
        }

        html += renderStatementRow(card, lastClosedStatementKey, "Último corte", summaries["card-" + card.id + "-" + lastClosedStatementKey]);
        html += renderStatementRow(card, openStatementKey, "Periodo actual", summaries["card-" + card.id + "-" + openStatementKey]);
        html += '</div>';
      });

      const installmentExpenses = appData.expenses.filter(function (expense) {
        return expense.paymentMethod === "installments";
      });

      html += '<div class="card" style="padding-bottom:4px"><div class="card-title">Compras MSI</div>';

      if (installmentExpenses.length === 0) {
        html += '<div class="empty-state">Registra un gasto con método MSI para verlo aquí.</div>';
      } else {
        const purchaseRows = installmentExpenses.map(function (expense) {
          const schedule = getInstallmentSchedule(expense);
          let paymentsMade = 0;
          schedule.forEach(function (installment) {
            if (installment.isPaid || installment.dueDate < today) {
              paymentsMade++;
            }
          });
          return { expense: expense, schedule: schedule, paymentsMade: paymentsMade };
        });

        purchaseRows.sort(function (first, second) {
          const firstFinished = first.paymentsMade >= first.expense.months ? 1 : 0;
          const secondFinished = second.paymentsMade >= second.expense.months ? 1 : 0;
          if (firstFinished !== secondFinished) {
            return firstFinished - secondFinished;
          }
          return second.expense.date.localeCompare(first.expense.date);
        });

        purchaseRows.forEach(function (purchaseRow) {
          const expense = purchaseRow.expense;
          const monthlyAmount = Number(expense.amount) / Number(expense.months);
          const paymentsLeft = expense.months - purchaseRow.paymentsMade;
          const progressPercentage = (purchaseRow.paymentsMade / expense.months) * 100;
          const lastDueDate = purchaseRow.schedule.length > 0 ? purchaseRow.schedule[purchaseRow.schedule.length - 1].dueDate : expense.date;

          html += '<div class="row tappable" style="display:block" data-action="edit-expense" data-id="' + expense.id + '">' +
            '<div style="display:flex;justify-content:space-between;gap:12px">' +
              '<div class="row-main"><div class="row-title">' + escapeHtml(expense.description) + '</div>' +
              '<div class="row-subtitle">' + escapeHtml(getPaymentMethodText("installments", expense.cardId)) + ' · ' + expense.months + ' meses</div></div>' +
              '<div class="row-amount">' + formatMoney(monthlyAmount) + '<div class="row-subtitle">/mes</div></div>' +
            '</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + progressPercentage.toFixed(1) + '%;background:var(--envelope-color)"></div></div>' +
            '<div class="row-subtitle" style="display:flex;justify-content:space-between;margin-top:6px">' +
              '<span>' + (paymentsLeft <= 0 ? 'Liquidada ✅' : 'Pagos: ' + purchaseRow.paymentsMade + ' de ' + expense.months) + '</span>' +
              '<span>Resta ' + formatMoney(Math.max(paymentsLeft, 0) * monthlyAmount) + '</span>' +
            '</div>' +
            '<div class="row-subtitle">Total ' + formatMoney(expense.amount) + ' · último pago ' + escapeHtml(formatDate(lastDueDate)) + '</div>' +
          '</div>';
        });
      }

      return html + '</div>';
    }

    /** Builds the fixed expenses screen: charges of the selected month and the full list. */
    function renderFixedExpenses() {
      const today = getTodayDateString();
      const monthCharges = [];

      appData.fixedExpenses.forEach(function (fixedExpense) {
        if (!fixedExpense.isActive) {
          return;
        }
        getFixedOccurrences(fixedExpense).forEach(function (occurrence) {
          if (occurrence.date.slice(0, 7) === selectedMonth) {
            monthCharges.push({ fixedExpense: fixedExpense, date: occurrence.date });
          }
        });
      });

      monthCharges.sort(function (first, second) {
        return first.date.localeCompare(second.date);
      });

      let html = '<div class="card" style="padding-bottom:4px"><div class="card-title">Cobros de ' + escapeHtml(formatMonth(selectedMonth)) + '</div>';

      if (monthCharges.length === 0) {
        html += '<div class="empty-state">No hay cobros fijos este mes.</div>';
      } else {
        html += '<p class="row-subtitle" style="margin-bottom:4px">Marca un cobro cuando se haga para pasarlo a la bitácora. Ahí puedes ajustar el monto real.</p>';
        monthCharges.forEach(function (charge) {
          const registeredExpense = getRegisteredExpense(charge.fixedExpense.id, charge.date);
          const amount = registeredExpense ? registeredExpense.amount : charge.fixedExpense.amount;
          html += '<div class="row">' +
            '<button class="check-button' + (registeredExpense ? ' checked' : '') + '" data-action="toggle-fixed-charge" data-id="' + charge.fixedExpense.id + '" data-date="' + charge.date + '">' + (registeredExpense ? '✓' : '') + '</button>' +
            '<div class="row-main"><div class="row-title">' + escapeHtml(charge.fixedExpense.name) + '</div>' +
            '<div class="row-subtitle">' + escapeHtml(formatShortDate(charge.date)) + ' · ' + escapeHtml(getPaymentMethodText(charge.fixedExpense.paymentMethod, charge.fixedExpense.cardId)) + '</div></div>' +
            '<div class="row-amount">' + formatMoney(amount) + '</div>' +
          '</div>';
        });
      }
      html += '</div>';

      html += '<div class="card" style="padding-bottom:4px"><div class="card-title">Todos tus fijos</div>';

      if (appData.fixedExpenses.length === 0) {
        return html + '<div class="empty-state">Toca + para agregar renta, luz, gasolina, suscripciones…</div></div>';
      }

      const sortedFixedExpenses = appData.fixedExpenses.slice();
      sortedFixedExpenses.sort(function (first, second) {
        return first.name.localeCompare(second.name);
      });

      sortedFixedExpenses.forEach(function (fixedExpense) {
        const nextOccurrence = getFixedOccurrences(fixedExpense).find(function (occurrence) {
          return occurrence.date >= today;
        });
        const nextText = fixedExpense.isActive
          ? (nextOccurrence ? 'próximo ' + formatShortDate(nextOccurrence.date) : '')
          : '<span class="badge">Inactivo</span>';

        html += '<div class="row tappable" data-action="edit-fixed" data-id="' + fixedExpense.id + '">' +
          '<div class="row-main"><div class="row-title">' + escapeHtml(fixedExpense.name) + '</div>' +
          '<div class="row-subtitle">' + escapeHtml(getFrequencyLabel(fixedExpense)) + ' · ' + escapeHtml(getPaymentMethodText(fixedExpense.paymentMethod, fixedExpense.cardId)) + ' · ' + nextText + '</div></div>' +
          '<div class="row-amount">' + formatMoney(fixedExpense.amount) + '</div>' +
        '</div>';
      });

      return html + '</div>';
    }

    /** Builds the settings screen: salary, envelopes and backup. */
    function renderSettings() {
      let html = '<div class="card">' +
        '<div class="card-title">Sueldo<button class="link-button" data-action="edit-settings">Editar</button></div>' +
        '<div class="row"><div class="row-main">Sueldo semanal</div><div class="row-amount">' + formatMoney(appData.settings.weeklySalary) + '</div></div>' +
        '<div class="row"><div class="row-main">Día de pago</div><div class="row-amount">' + weekDayNames[appData.settings.paydayDayOfWeek] + '</div></div>' +
      '</div>';

      if (appData.envelopes.length === 0) {
        html += '<div class="empty-state">Sin apartados.</div>';
      } else {
        appData.envelopes.forEach(function (envelope) {
          html += '<div class="row tappable" data-action="edit-envelope" data-id="' + envelope.id + '">' +
            '<div class="row-main">' + escapeHtml(envelope.name) + '</div>' +
            '<div class="row-amount">' + formatMoney(envelope.weeklyAmount) + '</div>' +
          '</div>';

        html += '<div class="row"><div class="row-main row-subtitle">Total semanal</div><div class="row-amount">' + formatMoney(getEnvelopeTotal()) + '</div></div>';

      html += '</div>';

      html += '<div class="card">' +
          '<div class="card-title">Respaldo</div>' +

    // ---------- Forms (bottom sheet) ----------

    /** Builds option tags from a list of values, marking the selected one. */
    function buildOptions(options, selectedValue) {
      let html = "";
      options.forEach(function (option) {
        html += '<option value="' + escapeHtml(option) + '"' + (option === selectedValue ? " selected" : "") + '>' + escapeHtml(option) + '</option>';
      });
      return html;
    }

    /** Builds option tags for payment methods. */
    function buildPaymentMethodOptions(methodKeys, selectedMethod) {
      let html = "";
      methodKeys.forEach(function (methodKey) {
        html += '<option value="' + methodKey + '"' + (methodKey === selectedMethod ? " selected" : "") + '>' + paymentMethodLabels[methodKey] + '</option>';
      });
      return html;
    }

    /** Builds option tags for the registered cards. */
    function buildCardOptions(selectedCardId) {
      if (appData.cards.length === 0) {
        return '<option value="">Agrega una tarjeta primero</option>';
      }
      let html = "";
      appData.cards.forEach(function (card) {
        html += '<option value="' + card.id + '"' + (card.id === selectedCardId ? " selected" : "") + '>' + escapeHtml(card.name) + '</option>';

      return html;

        '<button type="button" class="text-button" data-action="close-sheet">Cancelar</button></div>';
    }

    /** Builds the save and (when editing) delete buttons. */
    function buildSheetButtons() {
      let html = '<button type="submit" class="primary-button">Guardar</button>';
      if (sheetEditingId) {
        html += '<button type="button" class="danger-button" data-action="delete-record">Eliminar</button>';

    /** Builds the form to add or edit an expense in the log. */
    function buildExpenseForm(expense) {
      const defaultDate = selectedMonth === getMonthKey(new Date()) ? getTodayDateString() : selectedMonth + "-01";
      const selectedMethod = expense ? expense.paymentMethod : "cash";

      return buildSheetHeader(expense ? "Editar gasto" : "Nuevo gasto") +
        (expense && expense.fixedExpenseId ? '<p class="helper-text" style="margin-top:0">📌 Registrado desde un gasto fijo.</p>' : '') +
        '<div class="field"><label>Monto total</label><input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required value="' + (expense ? expense.amount : "") + '"></div>' +
        '<div class="field"><label>Descripción</label><input name="description" type="text" required maxlength="80" value="' + escapeHtml(expense ? expense.description : "") + '"></div>' +
